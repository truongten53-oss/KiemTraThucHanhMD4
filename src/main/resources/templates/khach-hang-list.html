<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Danh sách khách hàng</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="page">

    <div class="flash flash-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="flash flash-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="card">
        <div class="toolbar">
            <h1>Danh sách khách hàng</h1>
            <a th:href="@{/khach-hang/them-moi}" class="btn btn-add">+ Thêm mới</a>
            <a th:href="@{/}" class="btn btn-secondary">Về trang giao dịch</a>
        </div>

        <table class="data-table">
            <thead>
            <tr>
                <th>Mã khách hàng</th>
                <th>Tên khách hàng</th>
                <th>Số điện thoại</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="kh : ${customers}">
                <td th:text="${kh.maKhachHang}">KH-001</td>
                <td th:text="${kh.tenKhachHang}">Nguyễn Văn A</td>
                <td th:text="${kh.soDienThoai}">0912345678</td>
                <td th:text="${kh.email}">a@example.com</td>
                <td>
                    <form th:action="@{'/khach-hang/' + ${kh.maKhachHang} + '/xoa'}" method="post"
                          style="display:inline;"
                          th:attr="onsubmit=|return confirm('Xóa khách hàng ${kh.maKhachHang}?');|">
                        <button type="submit" class="link-detail" style="background:none;border:none;cursor:pointer;color:#c0392b;">Xóa</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(customers)}">
                <td colspan="5" class="empty-row">Chưa có khách hàng nào.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
