spring.application.name=realestate
server.port=8080

# Luon dung cookie de luu session, khong bao gio nhet ";jsessionid=..." vao URL
# (neu khong co dong nay, khi trinh duyet chan cookie, Tomcat se tu dong rewrite
# URL kem jsessionid -> lam sai duong dan -> loi 404 Whitelabel Error Page)
server.servlet.session.tracking-modes=cookie

# ==== Database (MySQL) ====
spring.datasource.url=jdbc:mysql://localhost:3306/realestate_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=04012004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate tu tao/cap nhat bang theo entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Chay data.sql SAU KHI Hibernate da tao bang xong (Spring Boot 2.5+)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

